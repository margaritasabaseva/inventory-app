<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Inventory Manager</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 Home Inventory Manager</h1>
            <p>Keep track of your household items</p>
        </header>

        <div class="add-item-section">
            <h2>Add New Item</h2>
            <form id="addItemForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="itemName">Item Name *</label>
                        <input type="text" id="itemName" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Appliances">Appliances</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Books & Media">Books & Media</option>
                            <option value="Toys & Games">Toys & Games</option>
                            <option value="Cleaning Supplies">Cleaning Supplies</option>
                            <option value="Food & Pantry">Food & Pantry</option>
                            <option value="Tools & Hardware">Tools & Hardware</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Decor">Decor</option>
                            <option value="Personal Care">Personal Care</option>
                            <option value="Sports & Outdoors">Sports & Outdoors</option>
                            <option value="Office Supplies">Office Supplies</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">Location *</label>
                        <select id="location" required>
                            <option value="">Select a location</option>
                            <option value="Kitchen">Kitchen</option>
                            <option value="Bathroom">Bathroom</option>
                            <option value="Bedroom">Bedroom</option>
                            <option value="Living Room">Living Room</option>
                            <option value="Garage">Garage</option>
                            <option value="Office">Office</option>
                            <option value="Basement">Basement</option>
                            <option value="Attic">Attic</option>
                            <option value="Closet">Closet</option>
                            <option value="Storage Room">Storage Room</option>
                            <option value="Laundry Room">Laundry Room</option>
                            <option value="Dining Room">Dining Room</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" min="1" value="1" required>
                    </div>

                    <div class="form-group">
                        <label for="barcode">Barcode</label>
                        <input type="text" id="barcode" placeholder="Optional">
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="3" placeholder="Additional notes..."></textarea>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Add Item</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                </div>
            </form>
        </div>

        <div class="inventory-section">
            <div class="section-header">
                <h2>Inventory Items</h2>
                <div class="filter-section">
                    <input type="text" id="searchInput" placeholder="Search items...">
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Appliances">Appliances</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Books & Media">Books & Media</option>
                        <option value="Toys & Games">Toys & Games</option>
                        <option value="Cleaning Supplies">Cleaning Supplies</option>
                        <option value="Food & Pantry">Food & Pantry</option>
                        <option value="Tools & Hardware">Tools & Hardware</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Decor">Decor</option>
                        <option value="Personal Care">Personal Care</option>
                        <option value="Sports & Outdoors">Sports & Outdoors</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div id="itemCount" class="item-count">Total items: 0</div>

            <div class="table-container">
                <table id="inventoryTable" class="inventory-table">
                    <thead>
                        <tr>
                            <th data-sort="name" class="sortable">Item Name <span class="sort-icon">↕</span></th>
                            <th data-sort="category" class="sortable">Category <span class="sort-icon">↕</span></th>
                            <th data-sort="location" class="sortable">Location <span class="sort-icon">↕</span></th>
                            <th data-sort="barcode" class="sortable">Barcode <span class="sort-icon">↕</span></th>
                            <th data-sort="notes">Notes</th>
                            <th data-sort="dateAdded" class="sortable">Date Added <span class="sort-icon">↕</span></th>
                            <th data-sort="quantity" class="sortable">Quantity <span class="sort-icon">↕</span></th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList">
                        <!-- Items will be dynamically added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
